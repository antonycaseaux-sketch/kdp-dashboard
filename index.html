// Retourne le net N-1 pour un mois donné (par nom) dans l'année précédente
function getNetN1(yearStr, monthName){
  const prevYear=String(+yearStr-1);
  if(!Y[prevYear])return null;
  const row=Y[prevYear].m.find(m=>m[0]===monthName);
  if(!row)return null;
  return row[1]-row[2]-row[3];
}

  const mp=$('monthPicker'),yp=$('yearPicker'),m=clampIndex();
  mp.innerHTML=m.map((x,i)=>`<button class="option ${i===currentIndex?'active':''}" data-i="${i}">${x[0]}</button>`).join('');
  yp.innerHTML=YEARS.map(y=>`<button class="option ${y===currentYear?'active':''}" data-y="${y}">${y}</button>`).join('');
  mp.querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>{e.stopPropagation();currentIndex=+b.dataset.i;render();mp.classList.remove('open')});
  yp.querySelectorAll('[data-y]').forEach(b=>b.onclick=e=>{e.stopPropagation();currentYear=b.dataset.y;currentIndex=0;render();yp.classList.remove('open')});
}

let rankMode='mois',tableMode='mois';
function syncToggles(){document.querySelectorAll('#rankToggle button').forEach(b=>b.classList.toggle('on',b.dataset.m===rankMode));document.querySelectorAll('#tableToggle button').forEach(b=>b.classList.toggle('on',b.dataset.t===tableMode))}
function renderYearsTable(){
$('tableTitle').textContent='Résultats par année';document.querySelector('.months-table thead th').textContent='Année';
let gr=0,ga=0,gf=0,gd=0,anyd=false;
$('monthsTable').innerHTML=YEARS.map(y=>{const ms=months(y);let r=0,a=0,f=0;ms.forEach(m=>{r+=m[1];a+=m[2];f+=m[3]});gr+=r;ga+=a;gf+=f;const n=r-a-f;
let cell='<td style="color:var(--muted);font-size:13px;text-align:right">—</td>';const py=String(+y-1);
if(Y[py]){let cn=0,pn=0,c=0;ms.forEach(m=>{const p=Y[py].m.find(x=>x[0]===m[0]);if(p){cn+=m[1]-m[2]-m[3];pn+=p[1]-p[2]-p[3];c++}});if(c){const d=cn-pn;gd+=d;anyd=true;cell='<td><span style="font-size:11px;font-weight:600;color:'+(d>=0?'var(--success)':'var(--danger)')+'">'+(d>=0?'+':'-')+new Intl.NumberFormat('fr-FR').format(Math.round(Math.abs(d)))+'</span></td>'}}
return '<tr data-y="'+y+'" class="'+(y===currentYear?'month-current':'')+'" style="cursor:pointer"><td>'+y+'</td><td>'+eur(r)+'</td><td class="red">'+eur(a)+'</td><td class="orange">'+eur(f)+'</td><td class="green">'+eur(n)+'</td>'+cell+'<td class="green">'+percent.format(r?n/r:0)+'</td></tr>'}).join('');
$('monthsTable').querySelectorAll('tr[data-y]').forEach(tr=>tr.onclick=()=>{currentYear=tr.dataset.y;currentIndex=months(currentYear).length-1;render()});
const gn=gr-ga-gf;$('yearRoyalties').textContent=eur(gr);$('yearAds').textContent=eur(ga);$('yearFreelance').textContent=eur(gf);$('yearNet').textContent=eur(gn);
$('yearNetN1').innerHTML='';
$('yearMargin').textContent=percent.format(gr?gn/gr:0);
}
function eur(v){return euro.format(v).replace(/[\s\u00a0\u202f]+€/g,'€')}
function render(){
  const [month,roy,ads,free,books]=current(),net=roy-ads-free,margin=roy?net/roy:0,all=months(currentYear);
  document.title=`Résultats KDP — ${month} ${currentYear}`;
  $('yearTitle').textContent=`${currentYear} ▾`;
  $('monthTitle').textContent=`${month} ▾`;
  $('royaltiesValue').textContent=eur(roy);
  $('adsValue').textContent=eur(ads);
  $('freelanceValue').textContent=eur(free);
  $('netValue').textContent=eur(net);
  $('marginValue').textContent=percent.format(margin);
  let rankBooks=books,rankRoy=roy;if(rankMode==='annee'||rankMode==='tout'){const mp={};let yr=0;(rankMode==='tout'?YEARS.flatMap(y=>months(y)):months(currentYear)).forEach(m=>{yr+=m[1];m[4].forEach(b=>{mp[b[0]]=(mp[b[0]]||0)+b[1]})});rankBooks=Object.keys(mp).map(k=>[k,mp[k]]);rankRoy=yr;}
$('topTitle').textContent='Classement '+(rankMode==='annee'?currentYear:rankMode==='tout'?'général':month+' '+currentYear);
  $('tableTitle').textContent='Résultats par mois '+currentYear;document.querySelector('.months-table thead th').textContent='Mois';

  $('topList').innerHTML=[...rankBooks].sort((a,b)=>b[1]-a[1]).map((b,i)=>{
    const medal=i===0?'gold':i===1?'silver':i===2?'bronze':'';
    return `<div class="book-row ${medal}"><div class="rank ${medal}">#${i+1}</div><div><div class="book-name">${b[0]}</div><div class="book-sub">${percent.format(rankRoy?b[1]/rankRoy:0)} du total</div></div><div class="book-amount">${eur(b[1])}</div></div>`;
  }).join('')||'<div class="book-row"><div class="rank">-</div><div><div class="book-name">Pas communiqué</div><div class="book-sub">Pas communiqué</div></div><div class="book-amount">—</div></div>';

  if(tableMode==='annees'){renderYearsTable();renderPickers();syncToggles();return}
let tr=0,ta=0,tf=0,trn1=0,trn1count=0,tdiff=0;
  $('monthsTable').innerHTML=all.map((m,i)=>{
    const n=m[1]-m[2]-m[3],mg=m[1]?n/m[1]:0;
    tr+=m[1];ta+=m[2];tf+=m[3];
    const n1=getNetN1(currentYear,m[0]);const shortName=m[0].slice(0,4);
    let n1cell='<td style="color:var(--muted);font-size:13px;text-align:right">—</td>';
    if(n1!==null){
      trn1+=n1;trn1count++;
      const diff=n-n1;tdiff+=diff;
      const diffAbs=Math.round(Math.abs(diff));const diffStr=(diff>=0?'+':'-')+new Intl.NumberFormat('fr-FR').format(diffAbs);
      const diffColor=diff>=0?'var(--success)':'var(--danger)';
      n1cell=`<td><span style="font-size:11px;font-weight:600;color:${diffColor}">${diffStr}</span></td>`;
    }
    return `<tr class="${i===currentIndex?'month-current':''}"><td>${shortName}</td><td>${eur(m[1])}</td><td class="red">${eur(m[2])}</td><td class="orange">${eur(m[3])}</td><td class="green">${eur(n)}</td>${n1cell}<td class="green">${percent.format(mg)}</td></tr>`;
  }).join('');

  const yn=tr-ta-tf;
  $('yearRoyalties').textContent=eur(tr);
  $('yearAds').textContent=eur(ta);
  $('yearFreelance').textContent=eur(tf);
  $('yearNet').textContent=eur(yn);
$('yearNetN1').style.textAlign='left';$('yearNetN1').innerHTML=trn1count?'<span style="font-size:11px;font-weight:600;color:'+(tdiff>=0?'var(--success)':'var(--danger)')+'">'+(tdiff>=0?'+':'-')+new Intl.NumberFormat('fr-FR').format(Math.round(Math.abs(tdiff)))+'</span>':'';
  $('yearMargin').textContent=percent.format(tr?yn/tr:0);
  renderPickers();syncToggles();
}

window.addEventListener('DOMContentLoaded',()=>{
  const card=$('monthCard'),mp=$('monthPicker'),yp=$('yearPicker');
  card.addEventListener('click',e=>{
    if(e.target.id==='yearTitle'){e.stopPropagation();yp.classList.toggle('open');mp.classList.remove('open')}
    else{mp.classList.toggle('open');yp.classList.remove('open')}
  });
  document.addEventListener('click',e=>{if(!card.contains(e.target)){mp.classList.remove('open');yp.classList.remove('open')}});
  document.querySelectorAll('#rankToggle button').forEach(b=>b.onclick=()=>{rankMode=b.dataset.m;render()});document.querySelectorAll('#tableToggle button').forEach(b=>b.onclick=()=>{tableMode=b.dataset.t;render()});
render();
});
</script>
</body>

<style>/*pc-compact*/@media (min-width:641px){.months-table,.top-list{max-width:820px}.months-table th,.months-table td{padding:5px 14px;font-size:13px}.months-table th{font-size:11px}.top-list{gap:4px}.book-row{grid-template-columns:30px 1fr auto;gap:10px;padding:5px 12px;border-radius:10px}.rank{width:30px;height:30px;border-radius:8px;font-size:12px}.book-sub{margin-top:1px}.stat{padding:9px 14px}.stat-value{font-size:22px}.hero-main{padding:9px 12px}.section{padding:12px 16px}.toggle{max-width:820px}}</style>

<style>/*pc-side*/.side-pc{display:none}@media (min-width:1000px){.section.has-side{display:grid;grid-template-columns:minmax(0,820px) minmax(260px,1fr);column-gap:18px;align-items:start}.section.has-side>h2{grid-column:1/-1}.section.has-side>*{grid-column:1}.section.has-side>.side-pc{display:block;grid-column:2;grid-row:2/span 2;position:sticky;top:12px}.sp-box{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}.sp-t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}.sp-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:8px}.sp-lab{font-size:13px;font-weight:600}.sp-val{font-size:13px;font-weight:800}.sp-bar{grid-column:1/-1;height:6px;border-radius:4px;background:#e5e7eb;overflow:hidden}.sp-bar i{display:block;height:100%;background:var(--primary)}.sp-bar i.g{background:#f59e0b}.sp-kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:7px 0}.sp-kv b{text-align:right;font-weight:800}.sp-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:10px}.sp-stack i{display:block;height:100%}.s1{background:#f59e0b}.s2{background:var(--primary)}.s3{background:#d1d5db}.sp-leg{display:grid;gap:5px;font-size:12px}.sp-leg u{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;text-decoration:none}}</style>
<script>(function(){
const $=id=>document.getElementById(id);
const fm=v=>eur(Math.round(v));
const net=m=>m[1]-m[2]-m[3];
function bars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return rows.map((r,i)=>'<div class="sp-row"><div class="sp-lab">'+r[0]+'</div><div class="sp-val">'+fm(r[1])+'</div><div class="sp-bar"><i class="'+(i===0?'g':'')+'" style="width:'+Math.max(2,Math.round(r[1]/mx*100))+'%"></i></div></div>').join('')}
function box(t,body){return '<div class="sp-box"><div class="sp-t">'+t+'</div>'+body+'</div>'}
function kv(a,b){return '<div class="sp-kv"><span>'+a+'</span><b>'+b+'</b></div>'}
function ensure(sec,id){let a=$(id);if(!a){a=document.createElement('aside');a.id=id;a.className='side-pc';sec.appendChild(a);sec.classList.add('has-side')}return a}
function renderSide(){
const a=ensure(document.querySelector('.table-section'),'sideTable'),b=ensure(document.querySelector('.top-section'),'sideTop');
const allM=[];YEARS.forEach(y=>months(y).forEach(m=>allM.push([m[0]+' '+y,net(m)])));
const top5=arr=>arr.slice().sort((x,y)=>y[1]-x[1]).slice(0,5);
if(tableMode==='annees'){
const ys=YEARS.map(y=>[String(y),months(y).reduce((s,m)=>s+net(m),0)]).sort((x,y)=>y[1]-x[1]);
a.innerHTML=box('Années classées par net',bars(ys))+box('5 meilleurs mois de tous les temps',bars(top5(allM)));
}else{
const ym=months(currentYear).map(m=>[m[0],net(m)]);
const tot=ym.reduce((s,r)=>s+r[1],0);
const best=top5(allM)[0];
a.innerHTML=box('Meilleurs mois '+currentYear,bars(top5(ym)))+box('Repères',kv('Net moyen par mois en '+currentYear,fm(tot/ym.length))+kv('Meilleur mois de tous les temps',best[0]+' · '+fm(best[1])));
}
const mp={};
const add=m=>m[4].forEach(x=>{mp[x[0]]=(mp[x[0]]||0)+x[1]});
if(rankMode==='tout')YEARS.forEach(y=>months(y).forEach(add));else if(rankMode==='annee')months(currentYear).forEach(add);else add(months(currentYear)[currentIndex]);
const list=Object.keys(mp).map(k=>[k,mp[k]]).sort((x,y)=>y[1]-x[1]);
const tot=list.reduce((s,r)=>s+r[1],0)||1;
const sum=(i,j)=>list.slice(i,j).reduce((s,r)=>s+r[1],0);
const t3=Math.round(sum(0,3)/tot*100),t10=Math.round(sum(3,10)/tot*100),rest=Math.max(0,100-t3-t10);
b.innerHTML=box('Répartition des ventes','<div class="sp-stack"><i class="s1" style="width:'+t3+'%"></i><i class="s2" style="width:'+t10+'%"></i><i class="s3" style="width:'+rest+'%"></i></div><div class="sp-leg"><span><u class="s1"></u>Top 3 : '+t3+' %</span><span><u class="s2"></u>Places 4 à 10 : '+t10+' %</span><span><u class="s3"></u>Tous les autres : '+rest+' %</span></div>')+box('En bref',kv('Livres qui ont vendu',list.length)+kv('Total des livres',fm(tot))+kv('Moyenne par livre',fm(tot/Math.max(1,list.length))));
}
const _r=render;render=function(){_r();renderSide()};
renderSide();
})();</script>
